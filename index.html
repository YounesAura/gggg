<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mahdi wip | النسخة النهائية</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Creepster&family=Tajawal:wght@400;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050505;
            color: #e0e0e0;
            font-family: 'Tajawal', sans-serif;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        .background-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.95) 0%, rgba(20, 0, 0, 0.98) 100%);
            z-index: -2;
        }

        .fog {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,0,0,0.08) 0%, rgba(0,0,0,0) 80%);
            z-index: -1;
            pointer-events: none;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
        }

        h1.site-title {
            font-family: 'Creepster', cursive;
            font-size: 4.5rem;
            color: #ff0000;
            text-shadow: 0 0 15px #ff0000, 0 0 30px #8b0000, 0 0 50px #000;
            margin-bottom: 40px;
            letter-spacing: 3px;
            animation: pulseText 2s infinite alternate;
        }

        @keyframes pulseText {
            0% { transform: scale(1); text-shadow: 0 0 15px #ff0000; }
            100% { transform: scale(1.03); text-shadow: 0 0 30px #ff0000, 0 0 10px #ffffff; }
        }

        .profile-section {
            background: rgba(15, 2, 2, 0.9);
            border: 2px solid #8b0000;
            border-radius: 15px;
            padding: 35px;
            margin-bottom: 50px;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.15);
            backdrop-filter: blur(5px);
        }

        .profile-avatar {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ff0000;
            box-shadow: 0 0 25px #ff0000;
            margin-bottom: 15px;
            filter: grayscale(100%) contrast(110%);
            transition: transform 0.5s ease;
        }

        .profile-avatar:hover {
            transform: scale(1.1) rotate(-3deg);
        }

        .profile-name {
            font-size: 2rem;
            color: #fff;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px #000;
        }

        .profile-desc {
            color: #b0b0b0;
            font-size: 1.1rem;
            line-height: 1.6;
            max-width: 650px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 2.2rem;
            color: #ff0000;
            margin: 40px 0;
            text-shadow: 0 0 5px #000;
            border-bottom: 2px dashed #8b0000;
            display: inline-block;
            padding-bottom: 10px;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            margin-top: 20px;
        }

        .card {
            background: rgba(10, 2, 2, 0.9);
            border: 1px solid #4a0000;
            border-radius: 10px;
            overflow: hidden;
            transition: all 0.4s ease;
        }

        .card:hover {
            transform: translateY(-10px);
            border-color: #ff0000;
            box-shadow: 0 10px 25px rgba(255, 0, 0, 0.35);
        }

        .card-img-container {
            width: 100%;
            height: 320px;
            overflow: hidden;
            background: #000;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: contrast(115%);
            transition: transform 0.5s ease;
        }

        .card:hover .card-img {
            transform: scale(1.05);
        }

        .card-content {
            padding: 20px;
            text-align: right;
        }

        .card-title {
            color: #ff3333;
            font-size: 1.4rem;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .card-text {
            color: #cccccc;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        footer {
            margin-top: 60px;
            color: #555;
            font-size: 0.9rem;
            border-top: 1px solid #1a0000;
            padding-top: 20px;
        }
    </style>
</head>
